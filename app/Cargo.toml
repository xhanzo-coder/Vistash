[workspace]
# 成员顺序与依赖方向一致：vistash-core 在前，依赖它的 Tauri 层在后。
members = ["crates/vistash-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
license = "MIT"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 提示词与库的稳定标识使用 UUIDv7。自行拼装时间戳与随机位需要另引
# 随机数依赖，且要重复实现版本位与变体位规则，因此直接用官方实现。
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
  "serde",
] }

# profile 段只能定义在 workspace 根。成员 crate 里的同名段会被 cargo 忽略并告警，
# 因此 src-tauri 的 Cargo.toml 中不再重复这一段。
[profile.release]
opt-level = "s"
lto = true
strip = true
