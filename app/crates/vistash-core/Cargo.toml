[package]
name = "vistash-core"
description = "Vistash 的领域逻辑：库骨架、寻址、导入、媒体处理、色卡与索引"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# 本 crate 刻意不依赖 tauri。这张依赖表就是约束的编译期检查：
# 想在核心逻辑里调用 Tauri API 必须先改这里，而依赖表的改动在评审中看得见。
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
] }
webp = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

# 仅集成测试使用：制造真实的 ERROR_SHARING_VIOLATION（std 打开文件自带
# FILE_SHARE_DELETE，普通句柄挡不住删除，必须显式独占打开）。
[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
